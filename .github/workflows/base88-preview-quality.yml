name: Base88 Preview Quality

on:
  push:
    branches:
      - 'ca/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: base88-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test offline generated business sites
        run: node --experimental-strip-types --test tests/surprise-site.test.mjs
      - name: Verify launch ZIP export using Python's standard ZIP reader
        run: |
          node --experimental-strip-types --test tests/zip-store.test.mjs
          python3 -m zipfile -t /tmp/base88-launch-test.zip
          node --check tests/rls-staging-only.mjs
      - name: Build complete Next.js preview
        # Public test values only. No real Supabase credentials or customer data in CI.
        # This checks compilation, NOT live Supabase connectivity.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-not-an-actual-credential
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

      - name: Smoke-test built preview without credentials
        # Authenticated successful database writes require separate Supabase RLS tests.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-not-an-actual-credential
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set -euo pipefail
          npm run start -- --port 3033 > /tmp/base88-preview.log 2>&1 &
          NEXT_PID=$!
          trap 'kill "$NEXT_PID" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 40); do
            if curl -fsS -o /dev/null http://127.0.0.1:3033/surprise-me; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/base88-preview.log; exit 1; fi
          node --test tests/preview-api.test.mjs
